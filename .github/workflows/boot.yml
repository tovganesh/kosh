name: build-and-boot

# The gate that would have caught this project's core problem: it is not enough
# for the kernel to compile, it has to actually boot and say so on the serial
# port. Every PR must keep the boot markers alive.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Record the toolchain in use
        # Nightly floats, so record what this run actually used. If the build
        # breaks later from an upstream change, pin rust-toolchain.toml to the
        # date printed by the last green run.
        run: |
          echo "toolchain in use:"
          rustc --version --verbose
          cargo --version

      - name: Install GRUB and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 grub-pc-bin grub-common xorriso mtools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build, boot and assert serial markers
        run: ./scripts/run.sh --check

      - name: Upload boot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs
          path: |
            build/serial.txt
            build/qemu.log
